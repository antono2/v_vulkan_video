name: Release candidate CI

on:
  workflow_dispatch:
  push:
    paths-ignore: ['**/*.md']
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: vkvideo-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / stable / ${{ matrix.linkage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - linkage: shared
          - linkage: static
    env:
      VMODULES: ${{ github.workspace }}/source/modules
      VULKAN_SDK: /usr
      GLFW_INCLUDE: /usr/include
      GLFW_LIB: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source/v_vulkan_video
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/vulkan
          ref: v3.2.2
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/vulkan_memory_allocator
          ref: v2.6.2
          path: source/modules/antono2/vkmemalloc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/memory
          ref: v1.4.0
          path: source/modules/antono2/memory
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/imgui
          ref: v0.3.1
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/glfw
          ref: v2.0.1
          path: source/modules/antono2/glfw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/minimp4
          ref: v2.0.0 # minimp4: 9e3e3962e552a82d11284027c152112f5dc6cccf
          path: source/modules/antono2/minimp4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/h264
          ref: v2.0.1
          path: source/modules/antono2/h264
      - name: Set up released V compiler
        uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Verify the declared dependency graph
        shell: bash
        run: v run source/v_vulkan_video/scripts/check_installed_deps.vsh
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ffmpeg python3 libglfw3-dev libvulkan-dev libvulkan-volk-dev luajit patchelf pkg-config zip glslc glslang-tools spirv-tools
      - name: Test coded-pixel readback comparison
        if: matrix.linkage == 'shared'
        working-directory: source/v_vulkan_video
        run: python3 -m unittest discover -s scripts -p 'test_compare_nv12.py'
      - name: Check shader regeneration and failure preservation
        working-directory: source/v_vulkan_video
        run: python3 -m unittest discover -s scripts -p 'test_generate_shaders.py'
      - name: Verify generated binding ownership
        working-directory: source/modules/antono2/imgui
        run: |
          set -euo pipefail
          duplicates=$(comm -12 \
            <(sed -n 's/^pub struct C\.\([A-Za-z_][A-Za-z0-9_]*\).*/\1/p' imgui.v | sort -u) \
            <(sed -n 's/^pub struct C\.\([A-Za-z_][A-Za-z0-9_]*\).*/\1/p' implot/implot.v | sort -u))
          test -z "$duplicates" || { printf 'Duplicate C declarations:\n%s\n' "$duplicates"; exit 1; }
      - name: Test pinned Vulkan memory allocator
        if: matrix.linkage == 'shared'
        working-directory: source/modules/antono2/vkmemalloc
        run: v test .
      - name: Build native ImGui
        working-directory: source/modules/antono2/imgui
        run: v run build_vimgui.vsh --linkage '${{ matrix.linkage }}' --glfw system
      - name: Test and build player
        working-directory: source/v_vulkan_video
        run: |
          set -euo pipefail
          flags=()
          if [[ '${{ matrix.linkage }}' == static ]]; then flags+=(-d imgui_static); fi
          v "${flags[@]}" -cc gcc test .
          v "${flags[@]}" -cc gcc -o v_vulkan_video .
      - name: Package Ubuntu 24.04 release
        if: matrix.linkage == 'shared'
        working-directory: source/v_vulkan_video
        run: ./scripts/package_ci_ubuntu24.sh vkvideo-ubuntu24-amd64.zip
      - name: Upload Ubuntu release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.linkage == 'shared'
        with:
          path: source/v_vulkan_video/vkvideo-ubuntu24-amd64.zip
          # The checksum accompanies the archive in a separate artifact below.
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Upload Ubuntu package checksums
        if: matrix.linkage == 'shared'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vkvideo-ubuntu24-checksums
          path: source/v_vulkan_video/vkvideo-ubuntu24-amd64.zip.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Build diagnostic Ubuntu player
        if: matrix.linkage == 'shared'
        working-directory: source/v_vulkan_video
        run: |
          v -d debug -cc gcc -o v_vulkan_video .
          ./scripts/package_ci_ubuntu24.sh vkvideo-ubuntu24-amd64-debug.zip
      - name: Upload Ubuntu diagnostic package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.linkage == 'shared'
        with:
          path: source/v_vulkan_video/vkvideo-ubuntu24-amd64-debug.zip
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Upload diagnostic Ubuntu package checksum
        if: matrix.linkage == 'shared'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vkvideo-ubuntu24-debug-checksum
          path: source/v_vulkan_video/vkvideo-ubuntu24-amd64-debug.zip.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Package static Linux CI binary
        if: matrix.linkage == 'static'
        working-directory: source/v_vulkan_video
        run: tar -czf vkvideo-linux-ci-static.tar.gz v_vulkan_video
      - name: Upload static Linux CI binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.linkage == 'static'
        with:
          path: source/v_vulkan_video/vkvideo-linux-ci-static.tar.gz
          archive: false
          retention-days: 7
          if-no-files-found: error

  linux-v3:
    name: Linux / v3 / shared
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VMODULES: ${{ github.workspace }}/source/modules
      VULKAN_SDK: /usr
      GLFW_INCLUDE: /usr/include
      GLFW_LIB: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source/v_vulkan_video
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/vulkan
          ref: v3.2.2
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/vulkan_memory_allocator
          ref: v2.6.2
          path: source/modules/antono2/vkmemalloc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/memory
          ref: v1.4.0
          path: source/modules/antono2/memory
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/imgui
          ref: v0.3.1
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/glfw
          ref: v2.0.1
          path: source/modules/antono2/glfw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/minimp4
          ref: v2.0.0 # minimp4: 9e3e3962e552a82d11284027c152112f5dc6cccf
          path: source/modules/antono2/minimp4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/h264
          ref: v2.0.1
          path: source/modules/antono2/h264
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: b99970bd438a7bdcdfbe38f74d9364db801d5439
          path: toolchain/v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: 2cbaf6bc2367937cd5f0b4ef923d1ef9aad613b3
          path: toolchain/v/vc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/tccbin
          ref: d6e7ac1b1bcc98aed734a6ecbfa8509f24606c74
          path: toolchain/v/thirdparty/tcc
      - name: Build pinned V3 compiler
        run: |
          make -C toolchain/v local=1
          echo "$GITHUB_WORKSPACE/toolchain/v" >> "$GITHUB_PATH"
      - name: Verify the declared dependency graph
        shell: bash
        run: v run source/v_vulkan_video/scripts/check_installed_deps.vsh
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libglfw3-dev libvulkan-dev libvulkan-volk-dev pkg-config mesa-vulkan-drivers xvfb
      - name: Install headers matching pinned Vulkan
        run: |
          set -euo pipefail
          vulkan_root="$GITHUB_WORKSPACE/source/modules/antono2/vulkan"
          registry_commit=$(tr -d '\r\n' < "$vulkan_root/REGISTRY_COMMIT")
          headers_checkout="$RUNNER_TEMP/Vulkan-Headers"
          git init -q "$headers_checkout"
          git -C "$headers_checkout" remote add origin https://github.com/KhronosGroup/Vulkan-Headers.git
          git -C "$headers_checkout" fetch --depth 1 origin "$registry_commit"
          git -C "$headers_checkout" checkout --detach FETCH_HEAD
          test "$(git -C "$headers_checkout" rev-parse HEAD)" = "$registry_commit"
          sudo cp -R "$headers_checkout/include/." "$VULKAN_SDK/include/"
          volk_commit=$(tr -d '\r\n' < "$vulkan_root/VOLK_COMMIT")
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/zeux/volk/$volk_commit/volk.h" \
            --output "$RUNNER_TEMP/volk.h"
          sudo install -m 0644 "$RUNNER_TEMP/volk.h" "$VULKAN_SDK/include/volk.h"
      - name: Build native ImGui
        working-directory: source/modules/antono2/imgui
        run: v run build_vimgui.vsh --linkage shared --glfw system
      - name: Build and test player with pinned V3 and TinyCC
        working-directory: source/v_vulkan_video
        run: |
          v -new-compiler -cc tcc test .
          v -new-compiler -cc tcc -o "$RUNNER_TEMP/v_vulkan_video" .
          bash .github/scripts/smoke-vulkan-loader.sh "$RUNNER_TEMP/v_vulkan_video"

  linux-v-master:
    name: Advisory current V master and dependency masters
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VMODULES: ${{ github.workspace }}/source/modules
      VULKAN_SDK: /usr
      GLFW_INCLUDE: /usr/include
      GLFW_LIB: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source/v_vulkan_video
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/vulkan
          ref: master
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/vulkan_memory_allocator
          ref: master
          path: source/modules/antono2/vkmemalloc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/memory
          ref: v1.4.0
          path: source/modules/antono2/memory
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/imgui
          ref: master
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/glfw
          ref: master
          path: source/modules/antono2/glfw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/minimp4
          ref: master
          path: source/modules/antono2/minimp4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/h264
          ref: master
          path: source/modules/antono2/h264
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: master
          path: toolchain/v
      - name: Build current V master
        run: |
          make -C toolchain/v
          echo "$GITHUB_WORKSPACE/toolchain/v" >> "$GITHUB_PATH"
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libglfw3-dev libvulkan-dev libvulkan-volk-dev pkg-config mesa-vulkan-drivers xvfb
      - name: Install headers matching Vulkan master
        run: |
          set -euo pipefail
          vulkan_root="$GITHUB_WORKSPACE/source/modules/antono2/vulkan"
          registry_commit=$(tr -d '\r\n' < "$vulkan_root/REGISTRY_COMMIT")
          headers_checkout="$RUNNER_TEMP/Vulkan-Headers"
          git init -q "$headers_checkout"
          git -C "$headers_checkout" remote add origin https://github.com/KhronosGroup/Vulkan-Headers.git
          git -C "$headers_checkout" fetch --depth 1 origin "$registry_commit"
          git -C "$headers_checkout" checkout --detach FETCH_HEAD
          test "$(git -C "$headers_checkout" rev-parse HEAD)" = "$registry_commit"
          sudo cp -R "$headers_checkout/include/." "$VULKAN_SDK/include/"
          volk_commit=$(tr -d '\r\n' < "$vulkan_root/VOLK_COMMIT")
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/zeux/volk/$volk_commit/volk.h" \
            --output "$RUNNER_TEMP/volk.h"
          sudo install -m 0644 "$RUNNER_TEMP/volk.h" "$VULKAN_SDK/include/volk.h"
      - name: Build and test player with V3
        run: |
          cd source/modules/antono2/imgui
          v run build_vimgui.vsh --linkage shared --glfw system
          cd "$GITHUB_WORKSPACE/source/v_vulkan_video"
          v -new-compiler -cc tcc test .
          v -new-compiler -cc tcc -o "$RUNNER_TEMP/v_vulkan_video" .
          bash .github/scripts/smoke-vulkan-loader.sh "$RUNNER_TEMP/v_vulkan_video"

  windows:
    name: Windows / ${{ matrix.compiler }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [stable, v3]
    env:
      VMODULES: ${{ github.workspace }}\source\modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source/v_vulkan_video
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/vulkan
          ref: v3.2.2
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/vulkan_memory_allocator
          ref: v2.6.2
          path: source/modules/antono2/vkmemalloc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/memory
          ref: v1.4.0
          path: source/modules/antono2/memory
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/imgui
          ref: v0.3.1
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/glfw
          ref: v2.0.1
          path: source/modules/antono2/glfw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/minimp4
          ref: v2.0.0 # minimp4: 9e3e3962e552a82d11284027c152112f5dc6cccf
          path: source/modules/antono2/minimp4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/h264
          ref: v2.0.1
          path: source/modules/antono2/h264
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        if: matrix.compiler == 'stable'
        with:
          version: 0.5.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.compiler == 'v3'
        with:
          repository: vlang/v
          ref: b99970bd438a7bdcdfbe38f74d9364db801d5439
          path: toolchain/v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.compiler == 'v3'
        with:
          repository: vlang/vc
          ref: 2cbaf6bc2367937cd5f0b4ef923d1ef9aad613b3
          path: toolchain/v/vc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.compiler == 'v3'
        with:
          repository: vlang/tccbin
          ref: 86ae5844b8b56071b21ae3aa138b247d5eb9ddd9
          path: toolchain/v/thirdparty/tcc
      - name: Build pinned V3 compiler
        if: matrix.compiler == 'v3'
        shell: cmd
        working-directory: toolchain/v
        run: makev.bat -msvc --local
      - name: Add pinned V3 compiler to PATH
        if: matrix.compiler == 'v3'
        shell: pwsh
        run: |
          "$env:GITHUB_WORKSPACE\toolchain\v" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify the declared dependency graph
        shell: bash
        run: v run source/v_vulkan_video/scripts/check_installed_deps.vsh
      - name: Install Vulkan SDK and SwiftShader test artifacts
        shell: bash
        working-directory: source/v_vulkan_video
        run: bash .github/scripts/setup-vulkan-ci.sh 1.4.309.0 v1.2
      - name: Install Volk headers
        shell: pwsh
        run: |
          $VolkDirectory = Join-Path $env:VULKAN_SDK 'Include\volk'
          New-Item -ItemType Directory -Force $VolkDirectory | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/zeux/volk/e640c6ea6420bdaf6248e85f736ab0b99491ae58/volk.h' -OutFile (Join-Path $VolkDirectory 'volk.h')
          Invoke-WebRequest 'https://raw.githubusercontent.com/zeux/volk/e640c6ea6420bdaf6248e85f736ab0b99491ae58/volk.c' -OutFile (Join-Path $VolkDirectory 'volk.c')
      - name: Install headers matching the pinned V3 Vulkan module
        if: matrix.compiler == 'v3'
        shell: pwsh
        run: |
          $RegistryCommit = (Get-Content source/modules/antono2/vulkan/REGISTRY_COMMIT -Raw).Trim()
          $Headers = Join-Path $env:RUNNER_TEMP 'Vulkan-Headers'
          git init $Headers
          git -C $Headers remote add origin https://github.com/KhronosGroup/Vulkan-Headers.git
          git -C $Headers fetch --depth 1 origin $RegistryCommit
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan header download failed' }
          git -C $Headers checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan header checkout failed' }
          if ((git -C $Headers rev-parse HEAD) -ne $RegistryCommit) { throw 'Vulkan header revision mismatch' }
          Copy-Item (Join-Path $Headers 'include/*') (Join-Path $env:VULKAN_SDK 'Include') -Recurse -Force
      - name: Build Windows package
        shell: pwsh
        working-directory: source/v_vulkan_video
        run: |
          $VsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $InstallPath = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $InstallPath) { throw 'Visual Studio C++ tools were not found' }
          Import-Module (Join-Path $InstallPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $InstallPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $Compiler = '${{ matrix.compiler }}'
          ./scripts/build_windows.ps1 -Compiler $Compiler
          $env:Path = "$(Resolve-Path dist\vkvideo-windows-x64);$env:Path"
          $HelpText = (& .\dist\vkvideo-windows-x64\v_vulkan_video.exe --help | Out-String)
          if ($LASTEXITCODE -ne 0 -or $HelpText -notmatch 'Usage:') {
            throw 'The Windows player did not print its command-line help.'
          }
          $GpuText = (& .\dist\vkvideo-windows-x64\v_vulkan_video.exe --list-gpus .\dist\vkvideo-windows-x64\res\20240917_095400.mp4 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $GpuText -notmatch 'Vulkan devices for H.264') {
            throw 'The Windows player could not enumerate Vulkan devices.'
          }
          $Flags = @('-cc', 'msvc', '-cflags', '/DWIN32_LEAN_AND_MEAN')
          if ($Compiler -eq 'v3') { $Flags += '-new-compiler' }
          v @Flags test .
          if ($LASTEXITCODE -ne 0) { throw 'Windows player tests failed' }
          ./scripts/verify_windows_package.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vkvideo-windows-${{ matrix.compiler }}
          path: |
            source/v_vulkan_video/dist/vkvideo-windows-x64.zip
            source/v_vulkan_video/dist/vkvideo-windows-x64.zip.sha256
          retention-days: 7
          if-no-files-found: error
