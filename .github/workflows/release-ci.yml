name: Release candidate CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: vkvideo-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / ${{ matrix.compiler }} / ${{ matrix.linkage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: stable
            linkage: shared
            v_version: latest
          - compiler: stable
            linkage: static
            v_version: latest
          - compiler: v3
            linkage: shared
            v_version: master
    env:
      VMODULES: ${{ github.workspace }}/source/modules
      VULKAN_SDK: /usr
      GLFW_INCLUDE: /usr/include
      GLFW_LIB: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          path: source/v_vulkan_video
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/vulkan
          ref: master
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/vulkan_memory_allocator
          ref: v2.2.0
          path: source/modules/antono2/vkmemalloc
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/mem
          ref: v1.0.3
          path: source/modules/antono2/mem
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/imgui
          ref: master
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/glfw
          ref: master
          path: source/modules/antono2/glfw
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/minimp4
          ref: master
          path: source/modules/antono2/minimp4
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/h264
          ref: master
          path: source/modules/antono2/h264
      - uses: prantlf/setup-v-action@v4
        with:
          version: ${{ matrix.v_version }}
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libglfw3-dev libvulkan-dev libvulkan-volk-dev luajit patchelf pkg-config zip
      - name: Verify generated binding ownership
        working-directory: source/modules/antono2/imgui
        run: |
          set -euo pipefail
          duplicates=$(comm -12 \
            <(sed -n 's/^pub struct C\.\([A-Za-z_][A-Za-z0-9_]*\).*/\1/p' imgui.v | sort -u) \
            <(sed -n 's/^pub struct C\.\([A-Za-z_][A-Za-z0-9_]*\).*/\1/p' implot/implot.v | sort -u))
          test -z "$duplicates" || { printf 'Duplicate C declarations:\n%s\n' "$duplicates"; exit 1; }
      - name: Test Vulkan memory allocator
        if: matrix.compiler == 'stable' && matrix.linkage == 'shared'
        working-directory: source/modules/antono2/vkmemalloc
        run: v test .
      - name: Build native ImGui
        working-directory: source/modules/antono2/imgui
        run: ./build_vimgui.sh --linkage '${{ matrix.linkage }}' --glfw system
      - name: Test and build player
        id: build_player
        continue-on-error: ${{ matrix.compiler == 'v3' }}
        working-directory: source/v_vulkan_video
        run: |
          set -euo pipefail
          flags=()
          if [[ '${{ matrix.compiler }}' == v3 ]]; then flags+=(-new-compiler); fi
          if [[ '${{ matrix.linkage }}' == static ]]; then flags+=(-d imgui_static); fi
          if [[ '${{ matrix.compiler }}' == stable ]]; then v "${flags[@]}" test .; fi
          v "${flags[@]}" -cc gcc -o v_vulkan_video .
      - name: Report V3 compatibility warning
        if: matrix.compiler == 'v3' && steps.build_player.outcome == 'failure'
        run: echo '::warning::The experimental V3 player build failed; stable V remains authoritative.'
      - name: Package Ubuntu 24.04 release
        if: matrix.compiler == 'stable' && matrix.linkage == 'shared'
        working-directory: source/v_vulkan_video
        run: ./scripts/package_ci_ubuntu24.sh vkvideo-ubuntu24-amd64.zip
      - name: Upload Ubuntu release package
        uses: actions/upload-artifact@v7
        if: matrix.compiler == 'stable' && matrix.linkage == 'shared'
        with:
          path: source/v_vulkan_video/vkvideo-ubuntu24-amd64.zip
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Build diagnostic Ubuntu player
        if: matrix.compiler == 'stable' && matrix.linkage == 'shared'
        working-directory: source/v_vulkan_video
        run: |
          v -d debug -cc gcc -o v_vulkan_video .
          ./scripts/package_ci_ubuntu24.sh vkvideo-ubuntu24-amd64-debug.zip
      - name: Upload Ubuntu diagnostic package
        uses: actions/upload-artifact@v7
        if: matrix.compiler == 'stable' && matrix.linkage == 'shared'
        with:
          path: source/v_vulkan_video/vkvideo-ubuntu24-amd64-debug.zip
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Package static Linux CI binary
        if: matrix.compiler == 'stable' && matrix.linkage == 'static'
        working-directory: source/v_vulkan_video
        run: tar -czf vkvideo-linux-ci-static.tar.gz v_vulkan_video
      - name: Upload static Linux CI binary
        uses: actions/upload-artifact@v7
        if: matrix.compiler == 'stable' && matrix.linkage == 'static'
        with:
          path: source/v_vulkan_video/vkvideo-linux-ci-static.tar.gz
          archive: false
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows / stable
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VMODULES: ${{ github.workspace }}\source\modules
    steps:
      - uses: actions/checkout@v7
        with:
          path: source/v_vulkan_video
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/vulkan
          ref: master
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/vulkan_memory_allocator
          ref: v2.2.0
          path: source/modules/antono2/vkmemalloc
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/mem
          ref: v1.0.3
          path: source/modules/antono2/mem
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/imgui
          ref: master
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/glfw
          ref: master
          path: source/modules/antono2/glfw
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/minimp4
          ref: master
          path: source/modules/antono2/minimp4
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/h264
          ref: master
          path: source/modules/antono2/h264
      - uses: prantlf/setup-v-action@v4
        with:
          version: latest
      - name: Install Vulkan SDK and SwiftShader test artifacts
        shell: bash
        working-directory: source/v_vulkan_video
        run: bash .github/scripts/setup-vulkan-ci.sh 1.4.309.0 v1.2
      - name: Install Volk headers
        shell: pwsh
        run: |
          $VolkDirectory = Join-Path $env:VULKAN_SDK 'Include\volk'
          New-Item -ItemType Directory -Force $VolkDirectory | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/zeux/volk/master/volk.h' -OutFile (Join-Path $VolkDirectory 'volk.h')
          Invoke-WebRequest 'https://raw.githubusercontent.com/zeux/volk/master/volk.c' -OutFile (Join-Path $VolkDirectory 'volk.c')
      - name: Build Windows package
        shell: pwsh
        working-directory: source/v_vulkan_video
        run: |
          $VsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $InstallPath = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $InstallPath) { throw 'Visual Studio C++ tools were not found' }
          Import-Module (Join-Path $InstallPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $InstallPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./scripts/build_windows.ps1 -Compiler stable
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          path: source/v_vulkan_video/dist/vkvideo-windows-x64.zip
          archive: false
          retention-days: 7
          if-no-files-found: error
