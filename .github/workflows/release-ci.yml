name: Release candidate CI

on:
  workflow_dispatch:
  push:
    paths-ignore: ['**/*.md']
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: vkvideo-release-${{ github.ref }}
  cancel-in-progress: true

env:
  V_C_ERROR_BUG_REPORT_DISABLED: 1

jobs:
  linux:
    name: Linux / stable / ${{ matrix.linkage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - linkage: shared
          - linkage: static
    env:
      VMODULES: ${{ github.workspace }}/source/modules
      VULKAN_SDK: /usr
      GLFW_INCLUDE: /usr/include
      GLFW_LIB: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source/v_vulkan_video
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        run: v run source/v_vulkan_video/scripts/ci_linux.vsh compatibility release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/vulkan
          ref: ${{ steps.compat.outputs.module_vulkan }}
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/vulkan_memory_allocator
          ref: ${{ steps.compat.outputs.module_vkmemalloc }}
          path: source/modules/antono2/vkmemalloc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/memory
          ref: ${{ steps.compat.outputs.module_memory }}
          path: source/modules/antono2/memory
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/imgui
          ref: ${{ steps.compat.outputs.module_imgui }}
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/glfw
          ref: ${{ steps.compat.outputs.module_glfw }}
          path: source/modules/antono2/glfw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/minimp4
          ref: ${{ steps.compat.outputs.module_minimp4 }}
          path: source/modules/antono2/minimp4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/h264
          ref: ${{ steps.compat.outputs.module_h264 }}
          path: source/modules/antono2/h264
      - name: Set up released V compiler
        uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        if: steps.compat.outputs.v_release != '0.5.2'
        with:
          version: ${{ steps.compat.outputs.v_release }}
      - name: Verify the declared dependency graph
        run: v run source/v_vulkan_video/scripts/check_installed_deps.vsh
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ffmpeg libglfw3-dev libvulkan-dev libvulkan-volk-dev luajit patchelf pkg-config glslc glslang-tools spirv-tools libx11-dev openbox xauth xvfb mesa-vulkan-drivers vulkan-validationlayers
      - name: Test coded-pixel readback comparison
        if: matrix.linkage == 'shared'
        working-directory: source/v_vulkan_video
        run: v run scripts/compare_nv12.vsh --self-test
      - name: Exercise package archive assembly and rejection checks
        if: matrix.linkage == 'shared'
        working-directory: source/v_vulkan_video
        run: v test scripts/packagezip scripts/windowspackage

      - name: Check the Windows source archive
        if: matrix.linkage == 'shared'
        working-directory: source/v_vulkan_video
        run: v run scripts/package_windows_source.vsh "$RUNNER_TEMP/vkvideo-windows-source.zip"
      - name: Check shader regeneration and failure preservation
        working-directory: source/v_vulkan_video
        run: v run scripts/generate_shaders.vsh --self-test
      - name: Verify generated binding ownership
        run: v run source/v_vulkan_video/scripts/ci_linux.vsh binding-ownership source/modules/antono2/imgui
      - name: Test pinned Vulkan memory allocator
        if: matrix.linkage == 'shared'
        working-directory: source/modules/antono2/vkmemalloc
        run: v test .
      - name: Build native ImGui
        working-directory: source/modules/antono2/imgui
        run: v run build_vimgui.vsh --linkage '${{ matrix.linkage }}' --glfw system
      - name: Test and build player
        env:
          PLAYER_LINKAGE: ${{ matrix.linkage }}
        run: v run source/v_vulkan_video/scripts/ci_linux.vsh test-player "$PLAYER_LINKAGE"
      - name: Test bounded Linux window startup without video hardware
        run: v run source/v_vulkan_video/scripts/ci_linux.vsh window-startup
      - name: Package Ubuntu 24.04 release
        if: matrix.linkage == 'shared'
        run: v run source/v_vulkan_video/scripts/ci_linux.vsh package regular
      - name: Upload Ubuntu release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.linkage == 'shared'
        with:
          path: source/v_vulkan_video/vkvideo-ubuntu24-amd64.zip
          # The checksum accompanies the archive in a separate artifact below.
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Upload Ubuntu package checksums
        if: matrix.linkage == 'shared'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vkvideo-ubuntu24-checksums
          path: source/v_vulkan_video/vkvideo-ubuntu24-amd64.zip.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Build diagnostic Ubuntu player
        if: matrix.linkage == 'shared'
        run: v run source/v_vulkan_video/scripts/ci_linux.vsh package debug
      - name: Upload Ubuntu diagnostic package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.linkage == 'shared'
        with:
          path: source/v_vulkan_video/vkvideo-ubuntu24-amd64-debug.zip
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Upload diagnostic Ubuntu package checksum
        if: matrix.linkage == 'shared'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vkvideo-ubuntu24-debug-checksum
          path: source/v_vulkan_video/vkvideo-ubuntu24-amd64-debug.zip.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Package static Linux CI binary
        if: matrix.linkage == 'static'
        working-directory: source/v_vulkan_video
        run: tar -czf vkvideo-linux-ci-static.tar.gz v_vulkan_video
      - name: Upload static Linux CI binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.linkage == 'static'
        with:
          path: source/v_vulkan_video/vkvideo-linux-ci-static.tar.gz
          archive: false
          retention-days: 7
          if-no-files-found: error

  linux-v3:
    name: Linux / v3 / shared
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VMODULES: ${{ github.workspace }}/source/modules
      VULKAN_SDK: /usr
      GLFW_INCLUDE: /usr/include
      GLFW_LIB: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source/v_vulkan_video
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        run: v run source/v_vulkan_video/scripts/ci_linux.vsh compatibility release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/vulkan
          ref: ${{ steps.compat.outputs.module_vulkan }}
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/vulkan_memory_allocator
          ref: ${{ steps.compat.outputs.module_vkmemalloc }}
          path: source/modules/antono2/vkmemalloc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/memory
          ref: ${{ steps.compat.outputs.module_memory }}
          path: source/modules/antono2/memory
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/imgui
          ref: ${{ steps.compat.outputs.module_imgui }}
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/glfw
          ref: ${{ steps.compat.outputs.module_glfw }}
          path: source/modules/antono2/glfw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/minimp4
          ref: ${{ steps.compat.outputs.module_minimp4 }}
          path: source/modules/antono2/minimp4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/h264
          ref: ${{ steps.compat.outputs.module_h264 }}
          path: source/modules/antono2/h264
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: ${{ steps.compat.outputs.v3_v }}
          path: toolchain/v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: ${{ steps.compat.outputs.v3_vc }}
          path: toolchain/v/vc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/tccbin
          ref: ${{ steps.compat.outputs.v3_tcc }}
          path: toolchain/v/thirdparty/tcc
      - name: Build pinned V3 compiler
        run: v run source/v_vulkan_video/scripts/ci_linux.vsh build-compiler toolchain/v pinned
      - name: Verify the declared dependency graph
        run: v run source/v_vulkan_video/scripts/check_installed_deps.vsh
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libglfw3-dev libvulkan-dev libvulkan-volk-dev pkg-config mesa-vulkan-drivers xvfb
      - name: Stage headers matching pinned Vulkan
        uses: antono2/vulkan/.github/actions/stage-vulkan-headers@0c2a5f832ea6792df3f34a6e1ef7390743162bd1
        with:
          bindings-path: source/modules/antono2/vulkan
      - name: Build native ImGui
        working-directory: source/modules/antono2/imgui
        run: v run build_vimgui.vsh --linkage shared --glfw system
      - name: Build and test player with pinned V3 and TinyCC
        run: v run source/v_vulkan_video/scripts/ci_linux.vsh test-player v3

  linux-v-master:
    name: Advisory current V master and dependency masters
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VMODULES: ${{ github.workspace }}/source/modules
      VULKAN_SDK: /usr
      GLFW_INCLUDE: /usr/include
      GLFW_LIB: /usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source/v_vulkan_video
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        run: v run source/v_vulkan_video/scripts/ci_linux.vsh compatibility release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/vulkan
          ref: master
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/vulkan_memory_allocator
          ref: master
          path: source/modules/antono2/vkmemalloc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/memory
          ref: ${{ steps.compat.outputs.module_memory }}
          path: source/modules/antono2/memory
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/imgui
          ref: master
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/glfw
          ref: master
          path: source/modules/antono2/glfw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/minimp4
          ref: master
          path: source/modules/antono2/minimp4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/h264
          ref: master
          path: source/modules/antono2/h264
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/v
          ref: master
          path: toolchain/v
      - name: Build current V master
        run: v run source/v_vulkan_video/scripts/ci_linux.vsh build-compiler toolchain/v master
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libglfw3-dev libvulkan-dev libvulkan-volk-dev pkg-config mesa-vulkan-drivers xvfb
      - name: Stage headers matching Vulkan master
        uses: antono2/vulkan/.github/actions/stage-vulkan-headers@0c2a5f832ea6792df3f34a6e1ef7390743162bd1
        with:
          bindings-path: source/modules/antono2/vulkan
      - name: Build native ImGui
        working-directory: source/modules/antono2/imgui
        run: v run build_vimgui.vsh --linkage shared --glfw system
      - name: Build and test player with V3
        run: v run source/v_vulkan_video/scripts/ci_linux.vsh test-player master

  windows:
    name: Windows / ${{ matrix.compiler }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [stable, v3]
    env:
      VMODULES: ${{ github.workspace }}\source\modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source/v_vulkan_video
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        run: v run source/v_vulkan_video/scripts/ci_linux.vsh compatibility release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/vulkan
          ref: ${{ steps.compat.outputs.module_vulkan }}
          path: source/modules/antono2/vulkan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/vulkan_memory_allocator
          ref: ${{ steps.compat.outputs.module_vkmemalloc }}
          path: source/modules/antono2/vkmemalloc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/memory
          ref: ${{ steps.compat.outputs.module_memory }}
          path: source/modules/antono2/memory
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/imgui
          ref: ${{ steps.compat.outputs.module_imgui }}
          path: source/modules/antono2/imgui
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/glfw
          ref: ${{ steps.compat.outputs.module_glfw }}
          path: source/modules/antono2/glfw
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/minimp4
          ref: ${{ steps.compat.outputs.module_minimp4 }}
          path: source/modules/antono2/minimp4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository_owner }}/h264
          ref: ${{ steps.compat.outputs.module_h264 }}
          path: source/modules/antono2/h264
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        if: matrix.compiler == 'stable'
        with:
          version: ${{ steps.compat.outputs.v_release }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.compiler == 'v3'
        with:
          repository: vlang/v
          ref: ${{ steps.compat.outputs.v3_v }}
          path: toolchain/v
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.compiler == 'v3'
        with:
          repository: vlang/vc
          ref: ${{ steps.compat.outputs.v3_vc }}
          path: toolchain/v/vc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.compiler == 'v3'
        with:
          repository: vlang/tccbin
          ref: ${{ steps.compat.outputs.windows_v3_tcc }}
          path: toolchain/v/thirdparty/tcc
      - name: Build pinned V3 compiler
        if: matrix.compiler == 'v3'
        shell: cmd
        working-directory: toolchain/v
        run: makev.bat -msvc --local
      - name: Add pinned V3 compiler to PATH
        if: matrix.compiler == 'v3'
        run: v run source/v_vulkan_video/scripts/windows_ci.vsh compiler-path toolchain/v
      - name: Verify the declared dependency graph
        run: v run source/v_vulkan_video/scripts/check_installed_deps.vsh
      - name: Install Vulkan SDK and SwiftShader test artifacts
        uses: antono2/vulkan/.github/actions/setup-vulkan-ci@0c2a5f832ea6792df3f34a6e1ef7390743162bd1
        with:
          sdk-version: ${{ steps.compat.outputs.ci_sdk }}
          artifact-tag: ${{ steps.compat.outputs.ci_runtime }}
          bindings-path: ${{ matrix.compiler == 'v3' && 'source/modules/antono2/vulkan' || '' }}
          volk-revision: ${{ steps.compat.outputs.volk }}
      - name: Build Windows package
        working-directory: source/v_vulkan_video
        run: v run scripts/build_windows.vsh --compiler ${{ matrix.compiler }} --verify
      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vkvideo-windows-${{ matrix.compiler }}
          path: |
            source/v_vulkan_video/dist/vkvideo-windows-x64.zip
            source/v_vulkan_video/dist/vkvideo-windows-x64.zip.sha256
          retention-days: 7
          if-no-files-found: error
